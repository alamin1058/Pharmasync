services:
  pharmasync-head-office:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmasync-head-office
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3000
      - PHARMASYNC_ADMIN_PASSWORD=${PHARMASYNC_ADMIN_PASSWORD:-}
      - PHARMASYNC_JWT_SECRET=${PHARMASYNC_JWT_SECRET:-}
      - LOG_JSON=true
    volumes:
      - pharmasync_ho_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/actuator/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  pharmasync-branch-pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmasync-branch-pos
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3001
      - PHARMASYNC_ADMIN_PASSWORD=${PHARMASYNC_ADMIN_PASSWORD:-}
      - PHARMASYNC_JWT_SECRET=${PHARMASYNC_JWT_SECRET:-}
    volumes:
      - pharmasync_branch_data:/app/data
    depends_on:
      pharmasync-head-office:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

volumes:
  pharmasync_ho_data:
  pharmasync_branch_data:
